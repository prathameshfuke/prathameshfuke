<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="180" fill="#0d1117"/>
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>
</defs>

<text x="450" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#f0f6fc">Prathamesh Fuke</text>

<text x="450" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="0.5">Founder, Nelviq &#8226; Agentic AI Systems</text>

<line x1="150" y1="135" x2="750" y2="135" stroke="#1f6feb" stroke-width="1" opacity="0.3"/>

<circle cx="150" cy="135" r="3" fill="#58a6ff">
<animate attributeName="r" values="2;4;2" dur="2.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="750" cy="135" r="3" fill="#58a6ff">
<animate attributeName="r" values="2;4;2" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
</circle>

<rect x="-100" y="133" width="120" height="4" fill="url(#glow)">
<animate attributeName="x" values="-120;750" dur="4.5s" repeatCount="indefinite"/>
</rect>

</svg>
